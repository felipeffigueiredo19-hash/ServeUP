<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ServeUp — Cardápio inteligente baseado no seu humor.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<title>ServeUp — Início</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
<body data-page="home">

<div class="background">
  <div class="background-glow background-glow-1"></div>
  <div class="background-glow background-glow-2"></div>
</div>

<section class="screen active" id="telaInicial">
<button class="btn-top-right" id="btnAbrirLoginAdm" type="button">
            LOGIN ADM
        </button>
<div class="home-container">
<span class="home-badge">
                CARDÁPIO INTELIGENTE
            </span>
<div class="home-logo">
<img alt="ServeUp" class="home-logo-img" src="imagens/serveup-logo.png"/>
</div>
<h1 class="home-title">
                Serve<span>Up</span>
</h1>
<div class="home-divider">
<span></span>

                ✦

                <span></span>
</div>
<h2 class="home-subtitle">
                Seu momento merece<br/>
                uma boa refeição.
            </h2>
<p class="home-description">

                Escolha como você está se sentindo
                e deixe o ServeUp encontrar uma
                sugestão especial para você.

            </p>
<button class="btn-principal" id="btnIniciar" type="button">
<span>
                    INICIAR
                </span>
<strong>
                    →
                </strong>
</button>
<p class="home-footer">
                FEITO PARA TORNAR SUA REFEIÇÃO ESPECIAL
            </p>
</div>
</section>
<script src="js/data.js" defer></script>
<script src="js/auth.js" defer></script>
