<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="ServeUp — solicitação da conta.">
<title>ServeUp — Conta solicitada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="conta-solicitada">
<div class="background">
  <div class="background-glow background-glow-1"></div>
  <div class="background-glow background-glow-2"></div>
</div>
<section class="screen active container-fluid tela-conta-solicitada" id="telaContaSolicitada">
  <div class="card conta-solicitada-card">
    <div class="conta-solicitada-icone" aria-hidden="true">🧾</div>
    <span class="section-kicker">SOLICITAÇÃO REALIZADA</span>
    <h1>O garçom já está trazendo sua conta</h1>
    <p>Seu pedido de conta foi registrado. Obrigado por escolher o ServeUP!</p>
    <button class="btn-conta-inicio" id="btnVoltarInicioConta" type="button">
      <span aria-hidden="true">⌂</span>
      <span>Voltar para o início</span>
    </button>
  </div>
</section>
<script>
document.getElementById('btnVoltarInicioConta').addEventListener('click', function () {
  window.location.href = '../index.html';
});
</script>
</body>
</html>
